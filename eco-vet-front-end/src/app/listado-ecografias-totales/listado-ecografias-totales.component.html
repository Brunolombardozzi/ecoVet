<div class="listado-page">
  <app-nav-bar (actulizarListadoEcos)="actualizarListado($event)"></app-nav-bar>

  <div class="listado-content">
    <div class="listado-panel">
      <h2 class="listado-title">Ecografías</h2>

      <div class="listado-toolbar">
        <div class="toolbar-group">
          <label class="toolbar-label">Fecha</label>
          <input class="input-data input-font-control" [(ngModel)]="fecha" placeholder="fecha" (change)="seleccionFecha()" type="date">
        </div>

        <div class="toolbar-actions">
          <button class="toolbar-btn" (click)="uploadData()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
              <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/>
              <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/>
            </svg>
            Actualizar
          </button>

          <button class="toolbar-btn toolbar-btn-primary" (click)="cargarEcografia()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
              <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
              <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/>
            </svg>
            Nueva Eco
          </button>

          <label class="toolbar-checkbox">
            <input type="checkbox" (click)="filtrarPorCasosEspeciales()">
            <span>Casos especiales</span>
          </label>
        </div>
      </div>

      <div class="listado-stats">
        <div class="stat-card">
          <span class="stat-label">Cantidad ecografías</span>
          <span class="stat-value">{{ formatearNumero(getCantidadEcografias(), 0) }}</span>
        </div>
        <div class="stat-card stat-card-accent">
          <span class="stat-label">Monto efectivo</span>
          <span class="stat-value">${{ formatearNumero(montoEfectivoDelDia, 2) }}</span>
        </div>
      </div>
    </div>

    <div class="listado-table-section">
      <label class="listado-table-title">LISTADO DEL DÍA</label>

      <div class="table-scroll-container">
        <div *ngIf="showSpinner" class="spinner-overlay">
          <div class="spinner-content">
            <div class="spinner-border" role="status"></div>
            <div>Cargando ecografías</div>
          </div>
        </div>

        <ngx-datatable
          [messages]="customMessages"
          [rows]="dataSource"
          [columns]="displayedColumns"
          [headerHeight]="40"
          [rowHeight]="30"
          [scrollbarH]="false"
          [scrollbarV]="true"
          [selectCheck]="true"
          [selected]="selected"
          class="listado-datatable">
          <ngx-datatable-column *ngFor="let column of displayedColumns" [name]="column.prop">
            <ng-template ngx-datatable-cell-template let-row="row" let-value="value">
              <div class="cell-content" (dblclick)="modificarRow(row)">
                {{ column.prop === 'Monto' ? formatearNumero(value, 2) : value }}
              </div>
            </ng-template>

            <ng-template ngx-datatable-header-template let-column="column">
              <div class="header-content">
                {{ getValue(column) }}
              </div>
            </ng-template>
          </ngx-datatable-column>
        </ngx-datatable>
      </div>
    </div>
  </div>

  <ng-template #cargaEcografia>
    <app-carga-ecografias [metodoPago]="null" [parent]="this" (actulizarListadoEcos)="actualizarListado($event)"></app-carga-ecografias>
  </ng-template>

  <ng-template #editarEcografia>
    <app-actualizacion-ecografias (actulizarListadoEcos)="actualizarListado($event)" [ecografiaSeleccionada]="ecografiaSeleccionada" [parent]="this"></app-actualizacion-ecografias>
  </ng-template>
</div>
